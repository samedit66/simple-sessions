[project]
name = "simple-sessions"
version = "0.1.0"
description = "Typed, server-side sessions for FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "samedit66" }]
keywords = ["fastapi", "authentication", "sessions", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.115.6,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
redis = ["redis>=5.2,<9"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/*.md", "RELEASING.md", "tests/**", "uv.lock"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18.2,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15.13,<1",
    "twine>=6,<7",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/typing_api.py"]
strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
