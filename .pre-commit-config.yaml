repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --all-extras ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, markdown]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --all-extras ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
      - id: mypy
        name: mypy
        entry: uv run --locked --all-extras mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --locked --all-extras pytest -q
        language: system
        pass_filenames: false
        always_run: true
