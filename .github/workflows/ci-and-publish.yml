name: CI and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.24"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ matrix.python == '3.15' && '0.13.9' || env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Expected release tag v{version}")
          PY
      - run: uv sync --locked
      - run: uv build --no-sources
      - run: uv run --no-sync twine check --strict dist/*
      - name: Smoke-test installed distributions
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$distribution" python -c 'from importlib.resources import files; from simple_sessions import BearerAuth; BearerAuth[int](); assert files("simple_sessions").joinpath("py.typed").is_file()'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*
